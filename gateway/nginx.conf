worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    types_hash_max_size 2048;
    server_tokens       off;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css text/xml;

    client_max_body_size  2m;
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          10s;

    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m     rate=20r/m;

    # Private IP ranges allowed to reach /metrics and /slo through the gateway.
    # Prometheus normally scrapes api-backend:8090 directly on the Docker
    # network (bypassing this gateway entirely) — this block is defense-in-depth
    # for cases where a request does reach the gateway for these paths.
    geo $is_internal_scraper {
        default          0;
        127.0.0.1        1;
        10.0.0.0/8       1;
        172.16.0.0/12    1;
        192.168.0.0/16   1;
    }

    upstream api_backend {
        least_conn;
        server    api-backend:8090;
        keepalive 32;
    }

    upstream ai_service {
        least_conn;
        server    ai-service:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Access-Control-Allow-Origin  "*"                                always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Trace-Id" always;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Trace-Id        $http_x_trace_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    60s;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            limit_req        zone=global burst=20 nodelay;
            limit_req_status 429;
            proxy_pass       http://api_backend;
        }

        location /ai/ {
            limit_req        zone=ai burst=5 nodelay;
            limit_req_status 429;
            rewrite          ^/ai/(.*) /$1 break;
            proxy_pass       http://ai_service;
            proxy_read_timeout 120s;
        }

        # /metrics and /slo — blocked for all external callers.
        # Prometheus scrapes api-backend:8090 directly on the internal Docker
        # network in normal operation; this guards the path through the gateway too.
        location = /metrics {
            if ($is_internal_scraper = 0) {
                return 403 '{"error":"forbidden","detail":"metrics endpoint is internal only"}';
            }
            add_header Content-Type application/json;
            proxy_pass http://api_backend;
        }

        location = /slo {
            if ($is_internal_scraper = 0) {
                return 403 '{"error":"forbidden","detail":"slo endpoint is internal only"}';
            }
            add_header Content-Type application/json;
            proxy_pass http://api_backend;
        }

        location /health/db {
            access_log off;
            proxy_pass http://api_backend;
        }
        location /api/docs  { proxy_pass http://api_backend; }

        location / {
            return 404 '{"error":"not_found"}';
            add_header Content-Type application/json;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            return 429 '{"error":"rate_limit_exceeded","retry_after":60}';
            add_header Content-Type application/json;
            add_header Retry-After 60;
        }

        error_page 502 503 504 = @gateway_error;
        location @gateway_error {
            return 503 '{"error":"service_unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
