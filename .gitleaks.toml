title = "BloodConnect Gitleaks config"

[allowlist]
  description = "Supabase CLI temp files — no credentials, only project ref"
  paths = [
    "supabase/.temp/pooler-url",
    "supabase/.temp/project-ref",
    "supabase/.temp/linked-project.json",
  ]

# Built-in Gitleaks rules will detect Firebase/Google service account keys.
# The keys/ directory is gitignored — ensure it never gets committed.