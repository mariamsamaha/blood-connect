services:
  api-backend:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    env_file:
      - ./api-backend/.env
    environment:
      - NODE_ENV=production
      - NOTIFICATION_BACKEND_URL=http://notification-backend:8080
    depends_on:
      notification-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health/db"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  notification-backend:
    build:
      context: ./notification-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./notification-backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
