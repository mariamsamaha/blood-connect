services:
  - type: web
    name: bloodconnect-api
    runtime: docker
    dockerfilePath: ./api-backend/Dockerfile
    dockerContext: ./api-backend
    plan: free
    healthCheckPath: /health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8090"
      - key: SUPABASE_HOST
        sync: false
      - key: SUPABASE_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-adminsdk.json
      - key: AI_SERVICE_URL
        sync: false
