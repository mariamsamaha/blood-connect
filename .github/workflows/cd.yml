name: BloodConnect CD

on:
  # Deploy only after CI succeeds on main/master
  workflow_run:
    workflows: [BloodConnect CI]
    branches: [main, master]
    types: [completed]

  # Manual deploy (staging or production)
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      skip_deploy_hooks:
        description: Build & push images only (skip Render/Fly deploy hooks)
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  gate — only proceed when CI passed (or manual dispatch)
  # ─────────────────────────────────────────────────────────────────────────────
  gate:
    name: CD — gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Resolve environment and image tag
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push — publish container images to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Publish — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-backend
            context: api-backend
            file: api-backend/Dockerfile
            image: bloodconnect-api
          - name: notification-backend
            context: notification-backend
            file: notification-backend/Dockerfile
            image: bloodconnect-notification
          - name: ai-service
            context: ai-service
            file: ai-service/Dockerfile
            image: bloodconnect-ai
          - name: gateway
            context: gateway
            file: gateway/Dockerfile
            image: bloodconnect-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.gate.outputs.environment == 'production' }}
            type=raw,value=${{ needs.gate.outputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  deploy — trigger hosting provider deploy hooks
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ needs.gate.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [gate, build-and-push]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_deploy_hooks != 'true' }}
    environment: ${{ needs.gate.outputs.environment }}
    timeout-minutes: 15

    steps:
      - name: Deploy API (Render hook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy notification backend (Render hook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}"

      - name: Deploy AI service (Render hook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_AI != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AI }}"

      - name: Deploy API (Fly.io)
        if: ${{ secrets.FLY_API_TOKEN != '' && vars.FLY_APP_API != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly deploy API
        if: ${{ secrets.FLY_API_TOKEN != '' && vars.FLY_APP_API != '' }}
        working-directory: api-backend
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          flyctl deploy --remote-only \
            --app "${{ vars.FLY_APP_API }}" \
            --image "ghcr.io/${OWNER}/bloodconnect-api:${{ needs.gate.outputs.image_tag }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for API rollout
        if: ${{ vars.DEPLOYED_API_URL != '' }}
        run: |
          URL="${{ vars.DEPLOYED_API_URL }}"
          for i in $(seq 1 30); do
            if curl -sf "$URL/" | grep -q '"status":"ok"'; then
              echo "API is live at $URL"
              exit 0
            fi
            echo "Waiting for $URL ... ($i/30)"
            sleep 10
          done
          echo "Deploy smoke check timed out"
          exit 1

      - name: Post-deploy health checks
        if: ${{ vars.DEPLOYED_API_URL != '' }}
        run: |
          URL="${{ vars.DEPLOYED_API_URL }}"
          curl -sf "$URL/" | jq -e '.status == "ok"'
          curl -sf "$URL/api/docs.json" | jq -e '.openapi == "3.0.0"'
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health/db")
          echo "health/db status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Unexpected health/db status"
            exit 1
          fi

      - name: CD summary
        if: always()
        run: |
          echo "Environment: ${{ needs.gate.outputs.environment }}"
          echo "Image tag: ${{ needs.gate.outputs.image_tag }}"
          echo "Images: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bloodconnect-{api,notification,ai,gateway}"
          echo "Configure deploy hooks: docs/CD.md"

  # ─────────────────────────────────────────────────────────────────────────────
  cd-success — summary job for branch protection
  # ─────────────────────────────────────────────────────────────────────────────
  cd-success:
    name: CD — completed
    runs-on: ubuntu-latest
    needs: [gate, build-and-push, deploy]
    if: always() && needs.gate.result == 'success'

    steps:
      - name: Verify CD pipeline
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e '
            .["build-and-push"].result == "success" and
            (.deploy.result == "success" or .deploy.result == "skipped")
          ' || {
            echo "CD pipeline failed:"
            echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
            exit 1
          }
          echo "CD pipeline completed successfully."
